[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
ataraxia-model = { path = "crates/model" }
ataraxia-lexer = { path = "crates/lexer" }
ataraxia-parser = { path = "crates/parser" }
ataraxia-interp = { path = "crates/interp" }
chumsky = { version = "1.0.0-alpha.7", features = ["nightly", "label"] }
dyn-clone = "1.0.17"
gc = { version = "0.5.0", features = ["derive", "nightly"] }
logos = "0.14.0"
ordered-float = "4.2.2"
rug = { version = "1.25.0", default-features = false, features = ["integer"] }